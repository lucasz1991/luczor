[[permission]]
identifier = "main-runtime"
description = "Allows the trusted main Luczor webview to use the explicitly registered application runtime commands."
commands.allow = [
    "capture_screen",
    "read_clipboard",
    "list_windows",
    "system_metrics",
    "move_mouse",
    "mouse_click",
    "type_text",
    "press_key",
    "open_url",
    "local_stt",
    "local_stt_rs",
    "local_tts",
    "voice_runtime_status",
    "install_voice_runtime",
    "verify_device_job",
    "agent_cli_detect",
    "agent_cli_run",
    "agent_write_bridge",
    "wf_file_read",
    "wf_file_write",
    "wf_run_script",
    "wf_http_request",
    "show_native_notification",
    "browser_open",
    "browser_navigate",
    "browser_close",
    "browser_click",
    "browser_read",
    "device_key_get",
    "device_key_set",
    "device_key_delete",
]
