[package]
name = "tauri-app"
version = "2.9.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
repository = "https://github.com/luczor/luczor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-prevent-default = "4.0"
tauri-plugin-store = "2.4.1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# OS perception + control
xcap = "0.9.6"
image = { version = "0.25", default-features = false, features = ["png"] }
enigo = "0.3"
arboard = "3.4"
sysinfo = "0.32.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
ignore = "0.4.33"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tree-sitter = "0.26.12"
tree-sitter-php = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
webbrowser = "1.0"
nvml-wrapper = "0.11"
netstat2 = "0.11.2"

# Optional native STT engine (SOLL §14 P5, "whisper_rs"). It compiles whisper.cpp
# from source and therefore requires CMake + a C/C++ toolchain at build time.
# Default OFF so the normal build needs no CMake. Enable with:
#   cargo build --features whisper_rs   (or set it in tauri.conf release build)
whisper-rs = { version = "0.12", optional = true }
hound = { version = "3", optional = true }
tauri-plugin-notification = "2.3.3"
notify-rust = "4.18.0"
notify = "8.2.0"
keyring = "4.1.6"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(windows)'.dependencies]
# Reuse xcap's locked Windows bindings for native adapter inventory (no shell).
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WindowsProgramming",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Performance",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
whisper_rs = ["dep:whisper-rs", "dep:hound"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# Local-model startup deliberately hashes the complete GGUF again inside the
# trusted native boundary. Keep that cryptographic hot path representative in
# debug builds without changing the debuggability of Luczor itself.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.

# Full GGUF verification is CPU-bound on processors without SHA extensions.
# Preserve the complete cancellable hash while optimizing only its hot path.
[profile.release.package.sha2]
opt-level = 3
