[package]
name = "tauri-app"
version = "2.9.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
repository = "https://github.com/luczor/luczor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-prevent-default = "4.0"
tauri-plugin-store = "2.4.1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# OS perception + control
xcap = "0.9.6"
image = { version = "0.25", default-features = false, features = ["png"] }
enigo = "0.3"
arboard = "3.4"
sysinfo = "0.32.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
webbrowser = "1.0"
nvml-wrapper = "0.11"

# Optional native STT engine (SOLL §14 P5, "whisper_rs"). It compiles whisper.cpp
# from source and therefore requires CMake + a C/C++ toolchain at build time.
# Default OFF so the normal build needs no CMake. Enable with:
#   cargo build --features whisper_rs   (or set it in tauri.conf release build)
whisper-rs = { version = "0.12", optional = true }
hound = { version = "3", optional = true }

[features]
whisper_rs = ["dep:whisper-rs", "dep:hound"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.
