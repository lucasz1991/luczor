<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luczor · Aktuelle Chat-Ansichten</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090d11;
        --panel: #10161d;
        --line: #27323d;
        --muted: #91a0ad;
        --text: #edf2f6;
        --accent: #5dd6a1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        overflow: hidden;
      }

      main {
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 12px;
        padding: 14px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 22px;
        font-weight: 720;
        letter-spacing: 0;
      }

      p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .source {
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--accent);
        font-size: 12px;
        padding: 7px 10px;
        white-space: nowrap;
      }

      .views {
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(720px, 1.35fr) minmax(420px, 0.85fr) minmax(300px, 0.55fr);
        gap: 12px;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 6px;
      }

      .view {
        min-width: 0;
        height: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .view--main {
        min-width: 720px;
      }

      .view--mini-large {
        min-width: 420px;
      }

      .view--mini-small {
        min-width: 300px;
      }

      .view header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }

      .view h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 690;
        letter-spacing: 0;
      }

      .size {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .frame-wrap {
        min-height: 0;
        overflow: hidden;
        background: #06090c;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #06090c;
      }

      .mini-small-frame {
        width: 420px;
        height: 720px;
        transform: scale(0.72);
        transform-origin: top left;
      }

      @media (max-width: 1100px) {
        body {
          overflow: auto;
        }

        main {
          height: auto;
          min-height: 100vh;
        }

        .views {
          grid-template-columns: 1fr;
          overflow: visible;
        }

        .view {
          height: 760px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Aktueller Zustand der Chat-Ansichten</h1>
          <p>Live eingebettet aus der laufenden Luczor-Entwicklungsansicht, nebeneinander als reine Review-Vorlage.</p>
        </div>
        <span class="source">Quelle: localhost:1420</span>
      </header>

      <section class="views" aria-label="Aktuelle Luczor-Ansichten">
        <article class="view view--main">
          <header>
            <h2>Große Hauptansicht</h2>
            <span class="size">Desktop breit</span>
          </header>
          <div class="frame-wrap">
            <iframe src="http://localhost:1420/" title="Luczor große Hauptansicht"></iframe>
          </div>
        </article>

        <article class="view view--mini-large">
          <header>
            <h2>Mini-Chat maximiert</h2>
            <span class="size">420 px Rahmen</span>
          </header>
          <div class="frame-wrap">
            <iframe src="http://localhost:1420/#mini-chat" title="Luczor Mini-Chat maximiert"></iframe>
          </div>
        </article>

        <article class="view view--mini-small">
          <header>
            <h2>Mini-Chat minimiert</h2>
            <span class="size">kompakt skaliert</span>
          </header>
          <div class="frame-wrap">
            <iframe
              class="mini-small-frame"
              src="http://localhost:1420/#mini-chat"
              title="Luczor Mini-Chat minimiert"
            ></iframe>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
