name: Linux and macOS test packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
          - os: macos-14
            target: universal-apple-darwin
            bundle: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev \
            cmake clang libclang-dev libgbm-dev libxdo-dev libwayland-dev libegl1-mesa-dev libxcb1-dev \
            gstreamer1.0-tools
      - uses: dtolnay/rust-toolchain@stable
      - name: Apple Silicon and Intel targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-voice-runtime.mjs
      - run: node --test scripts/prepare-voice-runtime.test.mjs
      - run: node --test scripts/tauri-launch.test.cjs scripts/check-debian-lifecycle.test.cjs scripts/uninstall-linux.test.cjs scripts/platform-config.test.cjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Recognize German offline with the bundled CPU model
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib bundled_whisper_recognizes_german_offline -- --ignored --nocapture
      - name: Build native test package (not a signed production release)
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify Linux package install, multimedia and data-preserving removal
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          packages=(src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          node scripts/check-debian-dependencies.cjs "${packages[0]}"
          node scripts/check-debian-voice.mjs "${packages[0]}"
          node scripts/check-debian-lifecycle.cjs "${packages[0]}"
          sudo apt-get install -y --no-install-recommends "./${packages[0]}"
          gst-inspect-1.0 fakevideosink >/dev/null
          gst-inspect-1.0 webvttenc >/dev/null
          node scripts/check-debian-lifecycle.cjs "${packages[0]}" --remove-installed-package-on-disposable-system
      - uses: actions/upload-artifact@v4
        with:
          name: luczor-test-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
