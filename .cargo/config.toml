[env]
# Installers run on other CPUs than the build host. No CUDA, OpenMP runtime or
# host-specific AVX instructions are required for the bundled CPU recognizer.
GGML_NATIVE = "OFF"
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"
GGML_BMI2 = "OFF"
GGML_SSE42 = "OFF"
GGML_OPENMP = "OFF"
